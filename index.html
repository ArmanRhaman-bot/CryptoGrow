<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CryptoGrow</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="stylesheet" href="style.css">
</head>

<body id="body" class="bg-gray-900 text-white">

<div class="max-w-md mx-auto p-4 space-y-4 pb-20">

  <!-- TOP BAR -->
  <div class="flex justify-between items-center">
    <button onclick="toggleTheme()" class="icon-btn">🌙</button>
    <button onclick="logout()" class="icon-btn">Logout</button>
  </div>

  <!-- PROFILE -->
  <div class="card flex items-center gap-4">
    <img id="avatar" class="w-16 h-16 rounded-full"/>
    <div>
      <h2 class="text-xl font-bold" id="name">Alex Johnson</h2>
      <p id="userId" class="text-sm text-gray-400"></p>
    </div>
  </div>

  <!-- CHECKIN -->
  <div class="card flex justify-between items-center">
    <div>
      <h3>Daily Check-in</h3>
      <p id="streak"></p>
    </div>
    <button onclick="checkIn()" class="btn">Check In</button>
  </div>

  <!-- POINTS -->
  <div class="card">
    <h3>Total Points: <span id="points">0</span></h3>

    <label class="task">
      <span>Follow Twitter (+50)</span>
      <input type="checkbox" onchange="completeTask(50,this)">
    </label>

    <label class="task">
      <span>Join Telegram (+100)</span>
      <input type="checkbox" onchange="completeTask(100,this)">
    </label>

    <label class="task">
      <span>Share Post (+80)</span>
      <input type="checkbox" onchange="completeTask(80,this)">
    </label>
  </div>

  <!-- REFER -->
  <div class="card">
    <h3>Refer a Friend</h3>
    <div id="refCode" class="ref-box"></div>
    <button onclick="copyRef()" class="btn-blue">Copy Link</button>
  </div>

  <!-- WITHDRAW -->
  <div class="card">
    <h3>💎 Balance: <span id="balance"></span></h3>
    <button id="withdrawBtn" onclick="withdraw()" class="btn-green">Withdraw</button>
  </div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <button class="active">🏠</button>
  <button>📋</button>
  <button>👥</button>
  <button>🏦</button>
</div>

<!-- TOAST -->
<div id="toast" class="toast hidden"></div>

<script src="script.js"></script>

</body>
</html>
